version: '3'

services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - .:/home/node/app
    attach: false # desabilita ou habilita os logs do mongo
    networks:
      - api
    command: mongod --bind_ip_all

  app:
    build: .
    depends_on:
      - mongodb
    entrypoint: .docker/entrypoint.sh
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/home/node/app
    networks:
        - api
    environment:
        DBAAS_MONGODB_ENDPOINT: mongodb://mongodb:27017/backend-app-marcelo
        AUTH_URL: "http://localhost:${PORT}/api/auth/"
        ENV_AMB: LOCAL
        APP_VERSION: Local version  

  mongodb-seed: # rodar esse container, importa os dados(json) no mongodb local
    image: mongo
    container_name: mongodb-seed
    depends_on:
      - mongodb
    volumes:
        - .:/home/node/app
    networks:
      - api
    command:
      - sh
      - -c
      # password=Teste@1234, campo password encriptado para testes 
      - | 
        mongoimport --uri mongodb://mongodb:27017/backend-app-marcelo --collection Users --file home/node/app/src/mocks/users.mock.json --jsonArray


networks:
  api:
    driver: bridge
